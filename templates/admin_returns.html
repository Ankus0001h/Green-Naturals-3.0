{% extends "admin_base.html" %}

{% block title %}Admin | Returns & Exchanges{% endblock %}
{% block page_title %}Returns Hub{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .rh * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    .rh i[class*="fa-"] { font-family: 'Font Awesome 6 Free', 'Font Awesome 6 Brands' !important; }

    /* ── Top Stats ── */
    .rh-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .rh-stat {
        background: #fff; border-radius: 14px; padding: 20px;
        border: 1px solid #eee;
    }
    .rh-stat-num { font-size: 26px; font-weight: 700; color: #111; }
    .rh-stat-label { font-size: 12px; color: #888; margin-top: 2px; }
    .rh-stat-icon { font-size: 14px; margin-bottom: 10px; }
    .rh-stat-icon.pending { color: #f59e0b; }
    .rh-stat-icon.approved { color: #22c55e; }
    .rh-stat-icon.rejected { color: #ef4444; }
    .rh-stat-icon.total { color: #6366f1; }

    /* ── Controls ── */
    .rh-controls {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .rh-tabs { display: flex; gap: 6px; background: #f5f5f5; padding: 4px; border-radius: 10px; }
    .rh-tab {
        padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
        font-size: 13px; font-weight: 600; color: #666; background: transparent;
        transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .rh-tab:hover { color: #333; }
    .rh-tab.active { background: #fff; color: #111; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .rh-badge {
        background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
        padding: 1px 7px; border-radius: 10px; display: none;
    }
    .rh-badge.green { background: #22c55e; }

    /* Policy Toggles */
    .rh-policy { display: flex; align-items: center; gap: 16px; }
    .rh-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .rh-toggle span { font-size: 12px; color: #666; font-weight: 500; }
    .rh-switch {
        -webkit-appearance: none; appearance: none; width: 36px; height: 20px;
        background: #ddd; border-radius: 20px; position: relative;
        cursor: pointer; transition: background 0.2s; border: none; outline: none;
    }
    .rh-switch:checked { background: #22c55e; }
    .rh-switch::before {
        content: ''; position: absolute; width: 14px; height: 14px;
        background: #fff; border-radius: 50%; top: 3px; left: 3px;
        transition: transform 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .rh-switch:checked::before { transform: translateX(16px); }

    /* ── Cards ── */
    .rh-grid { display: flex; flex-direction: column; gap: 14px; }
    .rh-card {
        background: #fff; border-radius: 14px; border: 1px solid #eee;
        overflow: hidden; transition: box-shadow 0.3s;
    }
    .rh-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.05); }

    .rh-card-top {
        padding: 20px 22px; display: flex; justify-content: space-between;
        align-items: flex-start; gap: 12px;
    }
    .rh-order-id { font-size: 16px; font-weight: 700; color: #111; }
    .rh-date { font-size: 12px; color: #999; margin-top: 4px; }
    .rh-pill {
        font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 8px;
        display: inline-block; margin-bottom: 8px;
    }
    .rh-pill.pending { background: #fef3c7; color: #b45309; }
    .rh-pill.approved { background: #dcfce7; color: #15803d; }
    .rh-pill.rejected { background: #fee2e2; color: #b91c1c; }
    .rh-amount {
        text-align: right; background: #111; color: #fff; padding: 10px 18px;
        border-radius: 10px; min-width: 90px; flex-shrink: 0;
    }
    .rh-amount-label { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.05em; }
    .rh-amount-val { font-size: 18px; font-weight: 700; }

    /* Card Body */
    .rh-card-body { padding: 0 22px 22px; }
    .rh-section { margin-bottom: 16px; }
    .rh-section:last-child { margin-bottom: 0; }
    .rh-label { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }

    .rh-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 12px; background: #fafafa; border-radius: 8px; margin-bottom: 4px;
    }
    .rh-item-name { font-size: 13px; font-weight: 500; color: #333; }
    .rh-item-qty { font-size: 11px; font-weight: 600; color: #888; }

    .rh-reason {
        font-size: 13px; color: #444; line-height: 1.6; padding: 12px 14px;
        background: #fafafa; border-radius: 8px; border-left: 3px solid #ddd;
    }
    .rh-notes {
        font-size: 12px; color: #92400e; padding: 10px 14px; background: #fffbeb;
        border-radius: 8px; margin-top: 8px; font-style: italic;
    }

    /* Photos */
    .rh-photos { display: flex; gap: 8px; flex-wrap: wrap; }
    .rh-photo {
        width: 64px; height: 64px; border-radius: 10px; overflow: hidden;
        cursor: pointer; border: 1px solid #eee; transition: transform 0.2s;
    }
    .rh-photo:hover { transform: scale(1.06); }
    .rh-photo img { width: 100%; height: 100%; object-fit: cover; }

    /* Actions */
    .rh-actions { display: flex; gap: 8px; padding: 16px 22px; border-top: 1px solid #f5f5f5; }
    .rh-btn {
        flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
        font-size: 13px; font-weight: 600; transition: all 0.2s;
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .rh-btn-approve { background: #111; color: #fff; }
    .rh-btn-approve:hover { background: #22c55e; }
    .rh-btn-approve:active { transform: scale(0.97); }
    .rh-btn-reject { background: #fff; color: #ef4444; border: 1px solid #fee2e2; }
    .rh-btn-reject:hover { background: #fef2f2; }
    .rh-btn-reject:active { transform: scale(0.97); }

    .rh-resolved {
        padding: 14px 22px; border-top: 1px solid #f5f5f5; text-align: center;
        font-size: 12px; font-weight: 600; color: #999;
    }

    /* Empty & Loader */
    .rh-empty {
        text-align: center; padding: 60px 20px; background: #fafafa;
        border-radius: 14px; border: 1px dashed #ddd;
    }
    .rh-empty i { font-size: 32px; color: #ccc; margin-bottom: 12px; display: block; }
    .rh-empty p { font-size: 13px; color: #999; }
    .rh-loader { text-align: center; padding: 60px; display: none; }
    .rh-spinner {
        width: 36px; height: 36px; border: 3px solid #f1f1f1;
        border-top-color: #22c55e; border-radius: 50%;
        animation: rspin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes rspin { to { transform: rotate(360deg); } }
    .rh-loader p { font-size: 12px; color: #aaa; }

    /* Lightbox */
    .rh-lb {
        position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999;
        display: none; align-items: center; justify-content: center;
        cursor: pointer; backdrop-filter: blur(6px);
    }
    .rh-lb.show { display: flex; }
    .rh-lb img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }
    .rh-lb-close {
        position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
        background: rgba(255,255,255,0.15); border-radius: 10px; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; cursor: pointer;
    }

    /* Card enter animation */
    @keyframes rh-fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ── */
    @media(max-width: 640px) {
        .rh-stats { grid-template-columns: 1fr 1fr; }
        .rh-stat { padding: 14px 16px; }
        .rh-stat-num { font-size: 22px; }
        .rh-controls { flex-direction: column; align-items: stretch; }
        .rh-tabs { width: 100%; }
        .rh-tab { flex: 1; justify-content: center; padding: 10px 12px; font-size: 12px; }
        .rh-policy { justify-content: center; }
        .rh-card-top { flex-direction: column; }
        .rh-amount { text-align: left; align-self: flex-start; }
        .rh-actions { flex-direction: column; }
    }
</style>

<div class="rh content-animate">

    <!-- Stats -->
    <div class="rh-stats">
        <div class="rh-stat"><div class="rh-stat-icon pending"><i class="fas fa-clock"></i></div><div class="rh-stat-num" id="stat-pending">0</div><div class="rh-stat-label">Pending</div></div>
        <div class="rh-stat"><div class="rh-stat-icon approved"><i class="fas fa-check"></i></div><div class="rh-stat-num" id="stat-approved">0</div><div class="rh-stat-label">Approved</div></div>
        <div class="rh-stat"><div class="rh-stat-icon rejected"><i class="fas fa-times"></i></div><div class="rh-stat-num" id="stat-rejected">0</div><div class="rh-stat-label">Rejected</div></div>
        <div class="rh-stat"><div class="rh-stat-icon total"><i class="fas fa-layer-group"></i></div><div class="rh-stat-num" id="stat-total">0</div><div class="rh-stat-label">Total</div></div>
    </div>

    <!-- Controls -->
    <div class="rh-controls">
        <div class="rh-tabs">
            <button id="toggle-returns-btn" class="rh-tab active" onclick="fetchReturnsData('return')">
                <i class="fas fa-undo-alt"></i> Returns <span id="return-badge" class="rh-badge">0</span>
            </button>
            <button id="toggle-exchanges-btn" class="rh-tab" onclick="fetchReturnsData('exchange')">
                <i class="fas fa-exchange-alt"></i> Exchanges <span id="exchange-badge" class="rh-badge green">0</span>
            </button>
        </div>
        <div class="rh-policy">
            <label class="rh-toggle">
                <input type="checkbox" id="allow_return_cb" class="rh-switch" {% if return_settings.allow_return %}checked{% endif %} onchange="updateReturnSettings()">
                <span>Returns</span>
            </label>
            <label class="rh-toggle">
                <input type="checkbox" id="allow_exchange_cb" class="rh-switch" {% if return_settings.allow_exchange %}checked{% endif %} onchange="updateReturnSettings()">
                <span>Exchanges</span>
            </label>
        </div>
    </div>

    <!-- Loader -->
    <div id="returns-loading" class="rh-loader">
        <div class="rh-spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Cards -->
    <div id="returns-content" class="rh-grid"></div>
</div>

<!-- Lightbox -->
<div class="rh-lb" id="img-lightbox" onclick="this.classList.remove('show')">
    <div class="rh-lb-close"><i class="fas fa-times"></i></div>
    <img id="lightbox-img" src="" alt="">
</div>

<script>
let currentType = 'return';

function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('img-lightbox').classList.add('show');
}

async function fetchReturnsData(type) {
    currentType = type;
    document.getElementById('toggle-returns-btn').classList.toggle('active', type === 'return');
    document.getElementById('toggle-exchanges-btn').classList.toggle('active', type === 'exchange');

    const container = document.getElementById('returns-content');
    const loading = document.getElementById('returns-loading');
    container.innerHTML = '';
    loading.style.display = 'block';

    try {
        const res = await fetch(`/admin/api/return-requests?type=${type}&_=${Date.now()}`);
        const data = await res.json();
        loading.style.display = 'none';

        // Badges
        const rb = document.getElementById('return-badge');
        const eb = document.getElementById('exchange-badge');
        rb.style.display = data.return_count > 0 ? 'inline' : 'none';
        rb.textContent = data.return_count;
        eb.style.display = data.exchange_count > 0 ? 'inline' : 'none';
        eb.textContent = data.exchange_count;

        // Stats
        if (data.success && data.requests) {
            let p = 0, a = 0, r = 0;
            data.requests.forEach(x => { if (x.status === 'Pending') p++; else if (x.status === 'Approved') a++; else r++; });
            document.getElementById('stat-pending').textContent = p;
            document.getElementById('stat-approved').textContent = a;
            document.getElementById('stat-rejected').textContent = r;
            document.getElementById('stat-total').textContent = data.requests.length;
        }

        if (!data.success || data.requests.length === 0) {
            container.innerHTML = `<div class="rh-empty"><i class="fas fa-box-open"></i><p>No ${type} requests</p></div>`;
            return;
        }

        data.requests.forEach((req, i) => {
            let itemsHtml = req.items.map(it => `<div class="rh-item"><span class="rh-item-name">${it.name}</span><span class="rh-item-qty">×${it.qty}</span></div>`).join('');

            let photosHtml = '';
            if (req.photo_urls && req.photo_urls.length) {
                photosHtml = `<div class="rh-section"><div class="rh-label">Evidence</div><div class="rh-photos">${req.photo_urls.map(u => `<div class="rh-photo" onclick="event.stopPropagation();openLightbox('${u}')"><img src="${u}" loading="lazy"></div>`).join('')}</div></div>`;
            }

            let pillClass = req.status === 'Approved' ? 'approved' : req.status === 'Rejected' ? 'rejected' : 'pending';

            let actionsHtml = '';
            if (req.status === 'Pending') {
                actionsHtml = `<div class="rh-actions">
                    <button class="rh-btn rh-btn-approve" onclick="updateReturnStatus('${req._id}','Approved')"><i class="fas fa-check"></i> Approve</button>
                    <button class="rh-btn rh-btn-reject" onclick="updateReturnStatus('${req._id}','Rejected')"><i class="fas fa-times"></i> Reject</button>
                </div>`;
            } else {
                const ic = req.status === 'Approved' ? 'fa-check-circle' : 'fa-times-circle';
                const cl = req.status === 'Approved' ? '#22c55e' : '#ef4444';
                actionsHtml = `<div class="rh-resolved"><i class="fas ${ic}" style="color:${cl};margin-right:4px"></i> ${req.status}</div>`;
            }

            const card = document.createElement('div');
            card.className = 'rh-card';
            card.style.animation = `rh-fadeIn 0.4s ${i * 0.06}s both`;
            card.innerHTML = `
                <div class="rh-card-top">
                    <div>
                        <span class="rh-pill ${pillClass}">${req.status}</span>
                        <div class="rh-order-id">#${req.order_id}</div>
                        <div class="rh-date"><i class="fas fa-calendar-day" style="margin-right:4px"></i>${req.created_at}</div>
                    </div>
                    <div class="rh-amount">
                        <div class="rh-amount-label">Value</div>
                        <div class="rh-amount-val">₹${req.total_amount}</div>
                    </div>
                </div>
                <div class="rh-card-body">
                    <div class="rh-section">
                        <div class="rh-label">Items</div>
                        ${itemsHtml}
                    </div>
                    <div class="rh-section">
                        <div class="rh-label">Reason</div>
                        <div class="rh-reason">${req.problem}</div>
                        ${req.notes ? `<div class="rh-notes">"${req.notes}"</div>` : ''}
                    </div>
                    ${photosHtml}
                </div>
                ${actionsHtml}
            `;
            container.appendChild(card);
        });
    } catch (e) {
        loading.style.display = 'none';
        container.innerHTML = `<div class="rh-empty"><i class="fas fa-wifi" style="color:#ef4444"></i><p>Connection error</p></div>`;
    }
}

async function updateReturnStatus(id, status) {
    let adminNotes = "";
    if (status === 'Rejected') {
        adminNotes = prompt("Rejection reason (visible to customer):");
        if (adminNotes === null) return;
    } else {
        if (!confirm(`Approve this ${currentType} request?`)) return;
    }
    try {
        const res = await fetch('/admin/api/update-return-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status, admin_notes: adminNotes })
        });
        if (res.ok) fetchReturnsData(currentType);
        else alert("Update failed.");
    } catch (e) { alert("Connection error."); }
}

async function updateReturnSettings() {
    try {
        const res = await fetch('/admin/api/update-return-settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                allow_return: document.getElementById('allow_return_cb').checked,
                allow_exchange: document.getElementById('allow_exchange_cb').checked
            })
        });
        if (!res.ok) alert("Settings update failed.");
    } catch (e) { alert("Connection error."); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('img-lightbox').classList.remove('show'); });
document.addEventListener('DOMContentLoaded', () => fetchReturnsData('return'));
</script>
{% endblock %}
