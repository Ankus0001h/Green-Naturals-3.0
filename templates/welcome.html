<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Green Naturals</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Plus+Jakarta+Sans:wght@200;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111; /* Deep Charcoal */
            --accent: #10b981; /* Signature Emerald */
            --secondary: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 1000px;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }

        /* Luxury Serif Styling */
        .welcome-tag {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.4rem, 4.5vw, 2.5rem);
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
            opacity: 0;
            transform: translateY(20px);
            animation: emergeUp 1.2s cubic-bezier(0.2, 0, 0.2, 1) forwards;
        }

        /* Massive Sans Name */
        .name-text {
            font-size: clamp(2.8rem, 11vw, 7.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin-bottom: 30px;
            display: block;
            overflow: hidden;
            color: var(--text);
        }

        .name-inner {
            display: block;
            opacity: 0;
            transform: translateY(100%);
            animation: slideReveal 1.4s cubic-bezier(0.2, 0, 0.2, 1) 0.3s forwards;
        }

        @keyframes emergeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Clean Emerald Line */
        .accent-line {
            width: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            margin: 0 auto;
            opacity: 0.6;
            animation: lineGrow 1.8s cubic-bezier(0.2, 0, 0.2, 1) 1s forwards;
        }

        @keyframes lineGrow {
            to { width: 120px; }
        }

        /* Footer Message */
        .footer-msg {
            margin-top: 50px;
            font-size: 10px;
            font-weight: 700;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.5em;
            opacity: 0;
            animation: fadeIn 1.5s ease 1.8s forwards;
        }

        /* Minimal Loader */
        .loader-wrap {
            margin-top: 30px;
            opacity: 0;
            animation: fadeIn 1s ease 2s forwards;
        }

        .dot-spinner {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Transitions */
        .wipe {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 1s ease-in-out;
        }

        .wipe-active {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="wipe" id="wipe"></div>

    <div class="container">
        <span class="welcome-tag">Welcome,</span>
        <h1 class="name-text">
            <span class="name-inner">{{ name }}</span>
        </h1>
        <div class="accent-line"></div>
        
        <div class="loader-wrap">
            <div class="dot-spinner">
                <div class="dot" style="animation-delay: 0s;"></div>
                <div class="dot" style="animation-delay: 0.2s;"></div>
                <div class="dot" style="animation-delay: 0.4s;"></div>
            </div>
        </div>

        <p class="footer-msg">Pure Herbal Excellence</p>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('wipe').classList.add('wipe-active');
            setTimeout(() => {
                window.location.href = "{{ next_url or '/' }}";
            }, 1000);
        }, 4500);
    </script>
</body>

</html>
