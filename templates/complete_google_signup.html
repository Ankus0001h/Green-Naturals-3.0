<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complete Your Profile | Green Naturals</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/images/official_brand_logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --green-primary: #1B7A3D;
            --green-light: #E8F5EC;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FAFBFC;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%; max-width: 400px;
            background: white; padding: 32px;
            border-radius: 20px; border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .avatar {
            width: 64px; height: 64px; border-radius: 50%;
            margin: 0 auto 16px; border: 3px solid var(--green-light);
            object-fit: cover;
        }
        .header h1 { font-size: 20px; font-weight: 800; color: var(--text-primary); }
        .header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        
        .input-wrap {
            position: relative; display: flex; align-items: center;
        }
        .input-wrap i { position: absolute; left: 12px; color: var(--text-secondary); font-size: 14px; }
        .input-wrap input {
            width: 100%; padding: 12px 12px 12px 40px;
            border: 1.5px solid var(--border); border-radius: var(--radius);
            font-size: 15px; transition: all 0.2s;
        }
        .input-wrap input:focus { border-color: var(--green-primary); outline: none; box-shadow: 0 0 0 4px var(--green-light); }

        .verify-btn {
            background: var(--green-primary); color: white; border: none;
            width: 100%; padding: 14px; border-radius: var(--radius);
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; margin-top: 10px;
        }
        .verify-btn:hover { background: #145C2E; transform: translateY(-1px); }
        .verify-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        .otp-section { display: none; margin-top: 24px; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

        .otp-grid { 
            display: flex; justify-content: center; gap: 10px; margin: 16px 0; 
        }
        .otp-grid input {
            width: 42px; height: 48px; text-align: center;
            font-size: 18px; font-weight: 700; border: 2px solid #6B7280;
            border-radius: 8px; transition: all 0.2s;
        }
        .otp-grid input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 4px var(--green-light);
            outline: none;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #111827; color: white; padding: 12px 24px;
            border-radius: 100px; font-size: 13px; font-weight: 500;
            display: none; z-index: 1000;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
    <div id="page-loader" style="position: fixed; inset: 0; z-index: 10002; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease;">
        <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
            <div class="animate-spin" style="position: absolute; inset: 0; border: 2px solid #f1f5f9; border-top-color: #22c55e; border-radius: 50%;"></div>
            <img src="/static/images/official_brand_logo.png" class="animate-pulse" style="width: 40px; height: 40px; object-fit: contain;">
        </div>
        <p style="margin-top: 1.5rem; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4em; color: #064e3b;">Green Naturals</p>
    </div>

    <div class="container">
        <div class="header">
            <div style="position: relative; width: 64px; height: 64px; margin: 0 auto 16px;">
                <img src="{{ user.profile_image or '/static/images/official_brand_logo.png' }}" class="avatar" style="margin-bottom: 0;">
                <div style="position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: #4285F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white;">
                    <i class="fab fa-google" style="color: white; font-size: 10px;"></i>
                </div>
            </div>
            <h1>Welcome, {{ user.username.split(' ')[0] }}!</h1>
            <p>One last step to secure your account.</p>
        </div>

        <div id="phone-step">
            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrap">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="phone" placeholder="Enter 10-digit number" maxlength="10" inputmode="numeric" pattern="[0-9]*">
                </div>
            </div>
            <button class="verify-btn" id="send-otp-btn">Send OTP</button>
        </div>

        <div class="otp-section" id="otp-step">
            <p style="font-size: 13px; text-align: center; color: var(--text-secondary);">
                Enter the 6-digit code sent to <br><b id="display-phone" style="color: var(--text-primary);"></b>
            </p>
            <div class="otp-grid" id="otp-inputs">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div id="resend-container" style="text-align: center; font-size: 12px; color: var(--text-secondary);">
                <span id="timer-text">Resend in <span id="timer">30</span>s</span>
                <a href="javascript:void(0)" id="resend-btn" style="display: none; color: var(--green-primary); font-weight: 700; text-decoration: none;">Resend OTP</a>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="javascript:void(0)" onclick="location.reload()" style="font-size: 12px; color: var(--text-secondary); text-decoration: none;">Wrong number? Go back</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const phoneInput = document.getElementById('phone');
        const sendBtn = document.getElementById('send-otp-btn');
        const otpStep = document.getElementById('otp-step');
        const phoneStep = document.getElementById('phone-step');

        window.onload = () => {
            const loader = document.getElementById('page-loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 800);
        };
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        sendBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if (phone.length < 10) return showToast("Enter a valid 10-digit number");

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                const res = await fetch('/api/signup/send-phone-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: phone})
                });
                const data = await res.json();
                
                if (data.success) {
                    phoneStep.style.display = 'none';
                    otpStep.style.display = 'block';
                    document.getElementById('display-phone').textContent = '+91 ' + phone;
                    startTimer();
                    setupOTP();
                } else {
                    showToast(data.error);
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send Verification Code';
                }
            } catch (e) {
                showToast("Something went wrong. Try again.");
                sendBtn.disabled = false;
            }
        });

        function setupOTP() {
            const inputs = document.querySelectorAll('.otp-grid input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    checkOTP();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        async function checkOTP() {
            const inputs = document.querySelectorAll('.otp-grid input');
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length === 6) {
                try {
                    const res = await fetch('/api/google-signup/verify-phone', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            otp: code,
                            phone: '+91' + phoneInput.value.trim()
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        window.location.href = '/welcome';
                    } else {
                        showToast(data.error);
                        inputs.forEach(i => i.value = '');
                        inputs[0].focus();
                    }
                } catch (e) {
                    showToast("Verification failed");
                }
            }
        }

        function startTimer() {
            let timeLeft = 30;
            const timerEl = document.getElementById('timer');
            const timerText = document.getElementById('timer-text');
            const resendBtn = document.getElementById('resend-btn');
            
            timerText.style.display = 'inline';
            resendBtn.style.display = 'none';
            timerEl.textContent = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerText.style.display = 'none';
                    resendBtn.style.display = 'inline';
                }
            }, 1000);
        }

        document.getElementById('resend-btn').addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            try {
                const res = await fetch('/api/signup/send-phone-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: phone})
                });
                const data = await res.json();
                if (data.success) {
                    showToast("New OTP sent!");
                    startTimer();
                } else {
                    showToast(data.error);
                }
            } catch (e) {
                showToast("Failed to resend OTP");
            }
        });
    </script>
</body>
</html>
