<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Page Not Found" }} - Green Naturals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gn: {
                            50: '#edfcf2',
                            100: '#d4f7e0',
                            200: '#acedca',
                            300: '#6dd47e',
                            400: '#3eb854',
                            500: '#2d8b4e',
                            600: '#1e753b',
                            700: '#185d30',
                            800: '#174a29',
                            900: '#143d23',
                            950: '#0a2213',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/images/official_brand_logo.png">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50/60 via-slate-50 to-gn-50 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800">
    
    <div class="max-w-lg w-full bg-white/90 backdrop-blur-xl border border-gn-100 shadow-2xl rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden">
        <!-- Background Subtle Glow -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-gn-200/40 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-emerald-200/40 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Brand Icon / 404 Badge -->
        <div class="relative inline-block mb-6">
            <div class="w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-3xl bg-gn-50 border border-gn-100 flex items-center justify-center shadow-lg shadow-gn-100/50 animate-float">
                <img src="/static/images/official_brand_logo.png" alt="Green Naturals" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
            </div>
            <span class="absolute -bottom-2 -right-2 bg-gn-600 text-white text-[10px] sm:text-xs font-extrabold px-3 py-1 rounded-full shadow-md uppercase tracking-wider">
                HTTP {{ code or "404" }}
            </span>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gn-950 tracking-tight mb-3">
            {{ heading or "Lost in the Woods?" }}
        </h1>

        <!-- Subtitle / Message -->
        <p class="text-slate-600 text-xs sm:text-sm font-medium leading-relaxed max-w-sm mx-auto mb-8">
            {{ message or "The page you are looking for doesn't exist, was removed, or has been moved to another location." }}
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-gradient-to-r from-gn-600 to-gn-700 hover:from-gn-700 hover:to-gn-800 text-white px-6 py-3 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-lg shadow-gn-200 hover:shadow-xl transition-all duration-200 active:scale-95">
                <i class="fas fa-home text-xs"></i> Return Home
            </a>
            <a href="/#shop" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white hover:bg-gn-50 border border-gn-200 text-gn-700 px-6 py-3 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-sm hover:shadow-md transition-all duration-200 active:scale-95">
                <i class="fas fa-store text-xs"></i> Browse Products
            </a>
        </div>

        {% if code %}
        <div class="mt-8 pt-4 border-t border-slate-100 flex items-center justify-center gap-2 text-[11px] font-semibold text-slate-400">
            <i class="fas fa-shield-alt text-gn-500"></i> Green Naturals Support &bull; HTTP {{ code }}
        </div>
        {% endif %}
    </div>

</body>
</html>
